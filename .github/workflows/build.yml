name: Build HispanShield

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-agent:
    name: Build & Test Agent (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install YARA (via Chocolatey)
        run: choco install yara -y --no-progress
        shell: powershell

      - name: Set YARA env vars
        run: |
          echo "YARA_INCLUDE_DIR=C:\ProgramData\chocolatey\lib\yara\tools\include" >> $env:GITHUB_ENV
          echo "YARA_LIB_DIR=C:\ProgramData\chocolatey\lib\yara\tools\lib" >> $env:GITHUB_ENV
        shell: powershell

      - name: Check (clippy)
        run: cargo clippy -p hispanshield-agent -- -D warnings

      - name: Build agent (release)
        run: cargo build --release -p hispanshield-agent

      - name: Run tests
        run: cargo test -p hispanshield-agent

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: hispanshield-agent-windows-x64
          path: target/release/hispanshield-agent.exe
          retention-days: 7

  build-ui:
    name: Build Dashboard (Tauri + React)
    runs-on: windows-latest
    needs: build-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (UI)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target/
          key: ${{ runner.os }}-cargo-ui-${{ hashFiles('ui/src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: TypeScript check
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build Tauri
        working-directory: ui
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hispanshield-installer-windows-x64
          path: ui/src-tauri/target/release/bundle/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Rust dependency audit
        run: cargo audit

      - name: Node.js dependency audit
        working-directory: ui
        run: npm audit --audit-level=high
